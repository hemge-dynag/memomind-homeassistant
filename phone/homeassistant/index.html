<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#0b0e14">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http: https:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Home Assistant</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="app-header">
      <h1 id="app-title">Home Assistant</h1>
      <span id="status" class="status">Démarrage…</span>
    </header>

    <main>
      <form id="config-form" class="config-form">
        <label class="field">
          <span id="url-label">URL de Home Assistant</span>
          <input id="ha-url" type="url" inputmode="url" autocomplete="off"
                 placeholder="http://homeassistant.local:8123" required>
        </label>

        <label class="field">
          <span id="token-label">Jeton d’accès longue durée</span>
          <input id="ha-token" type="password" autocomplete="off" required>
        </label>
        <p id="token-hint" class="hint"></p>

        <div class="actions">
          <button type="button" id="test-button">Tester la connexion</button>
          <button type="button" id="load-button">Charger les entités</button>
        </div>

        <label class="field field-inline">
          <input id="ha-autorefresh" type="checkbox" checked>
          <span id="autorefresh-label">Actualisation automatique</span>
        </label>
      </form>

      <section class="picker" id="picker" hidden>
        <label class="field">
          <span id="search-label">Rechercher une entité…</span>
          <input id="search-input" type="search" autocomplete="off" spellcheck="false">
        </label>

        <div class="picker-columns">
          <div class="picker-column">
            <h2 id="available-title" class="column-title">Entités disponibles</h2>
            <ul id="available-list" class="entity-list"></ul>
          </div>

          <div class="picker-column">
            <h2 id="selected-title" class="column-title">Entités de cette page</h2>
            <ul id="selected-list" class="entity-list selected"></ul>
          </div>
        </div>
      </section>

      <section class="pages">
        <div class="pages-header">
          <h2 id="pages-title" class="column-title">Pages</h2>
          <button type="button" id="add-page-button" class="small">Ajouter une page</button>
        </div>
        <p id="pages-hint" class="hint"></p>
        <div id="pages-list" class="pages-list"></div>
      </section>

      <div class="actions actions-main">
        <button type="submit" id="save-button" form="config-form">Enregistrer</button>
        <button type="button" id="sync-button">Synchroniser</button>
      </div>

      <p id="glasses-hint" class="hint"></p>
    </main>

    <template id="page-template">
      <article class="page-card">
        <div class="page-card-head">
          <input class="page-title" type="text" maxlength="32" data-role="title">
          <button type="button" class="small danger" data-role="delete">Supprimer</button>
        </div>
        <ul class="page-entities" data-role="entities"></ul>
        <p class="page-empty hint" data-role="empty"></p>
      </article>
    </template>

    <script type="module" src="plugin.js"></script>
  </body>
</html>
